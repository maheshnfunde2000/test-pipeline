name: Terraform CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: write
  security-events: write

jobs:

  # ============================================================
  # DEVSECOPS + TERRAFORM CI
  # Runs on Pull Requests and pushes to main
  # ============================================================

  terraform-ci:
    name: DevSecOps + Terraform CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Env_module/Pre_prod

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # Terraform Setup
      # ----------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform Version
        run: terraform version

      # ----------------------------------------------------------
      # Terraform Formatting
      # ----------------------------------------------------------

      - name: Terraform Format Check
        id: terraform_fmt
        run: terraform fmt -check -recursive

      # ==========================================================
      # DEVSECOPS - GITLEAKS
      # ==========================================================

      - name: Gitleaks Secret Scan
        id: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================================
      # DEVSECOPS - TRIVY
      # ==========================================================

      - name: Trivy Filesystem / IaC Scan
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: 1

      # ==========================================================
      # DEVSECOPS - CHECKOV
      # ==========================================================

      - name: Checkov IaC Security Scan
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: Env_module/Pre_prod
          framework: terraform
          soft_fail: true

      # ==========================================================
      # AZURE LOGIN - OIDC
      # ==========================================================

      - name: Azure Login (OIDC)
        id: azure_login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ==========================================================
      # TERRAFORM INIT
      # ==========================================================

      - name: Terraform Init
        id: terraform_init
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform init

      # ==========================================================
      # TFLINT
      # ==========================================================

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        id: tflint
        run: tflint

      # ==========================================================
      # TERRAFORM VALIDATE
      # ==========================================================

      - name: Terraform Validate
        id: terraform_validate
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform validate

      # ==========================================================
      # TERRAFORM PLAN
      # ==========================================================

      - name: Terraform Plan
        id: terraform_plan
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform plan -input=false -out=tfplan

      # ==========================================================
      # UPLOAD TERRAFORM PLAN
      # ==========================================================

      - name: Upload Terraform Plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: Env_module/Pre_prod/tfplan
          retention-days: 7

      # ==========================================================
      # PIPELINE SUMMARY
      # ==========================================================

      - name: DevSecOps Pipeline Summary
        if: always()
        run: |
          echo "# DevSecOps + Terraform Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Security Scans" >> "$GITHUB_STEP_SUMMARY"

          echo "| Tool | Purpose | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|---------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gitleaks | Secret detection | ${{ steps.gitleaks.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trivy | Vulnerability / IaC / Secret scan | ${{ steps.trivy.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Checkov | Terraform security scan | ${{ steps.checkov.outcome }} |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Terraform Checks" >> "$GITHUB_STEP_SUMMARY"

          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Terraform Format | ${{ steps.terraform_fmt.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TFLint | ${{ steps.tflint.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Terraform Validate | ${{ steps.terraform_validate.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Terraform Plan | ${{ steps.terraform_plan.outcome }} |" >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # INFRACOST - PULL REQUEST COST ANALYSIS
  # ============================================================

  infracost:
    name: Infracost - PR Cost Analysis
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout PR branch
      # ----------------------------------------------------------

      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          path: head

      # ----------------------------------------------------------
      # Checkout base branch
      # ----------------------------------------------------------

      - name: Checkout Base Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      # ----------------------------------------------------------
      # Infracost PR Diff
      # ----------------------------------------------------------

      - name: Infracost Cost Diff
        uses: infracost/actions/diff@v4
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          base-path: base/Env_module/Pre_prod
          head-path: head/Env_module/Pre_prod

      # ----------------------------------------------------------
      # Setup Infracost CLI
      # ----------------------------------------------------------

      - name: Setup Infracost CLI
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      # ----------------------------------------------------------
      # Generate Detailed Cost Breakdown
      # ----------------------------------------------------------

      - name: Generate Infracost Breakdown
        working-directory: head/Env_module/Pre_prod
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          infracost breakdown \
            --path=. \
            --format=json \
            --out-file=/tmp/infracost.json

      # ----------------------------------------------------------
      # Generate Resource Cost Summary
      # ----------------------------------------------------------

      - name: Generate Resource Cost Summary
        run: |
          echo "# Infracost Resource Cost Breakdown" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Estimated Monthly Cost" >> "$GITHUB_STEP_SUMMARY"

          TOTAL=$(jq -r '.totalMonthlyCost // "0"' /tmp/infracost.json)

          echo "**Total Monthly Cost: \$${TOTAL}**" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Resource Breakdown" >> "$GITHUB_STEP_SUMMARY"

          echo "| Resource | Monthly Cost |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|--------------|" >> "$GITHUB_STEP_SUMMARY"

          jq -r '
            .projects[]
            .breakdown.resources[]
            | [
                .name,
                (.monthlyCost // "0")
              ]
            | @tsv
          ' /tmp/infracost.json |
          while IFS=$'\t' read -r RESOURCE COST
          do
            echo "| \`$RESOURCE\` | \$$COST |" >> "$GITHUB_STEP_SUMMARY"
          done


  # ============================================================
  # INFRACOST - MAIN BRANCH BASELINE
  # ============================================================

  infracost-scan:
    name: Infracost - Update Main Baseline
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Infracost Scan
        uses: infracost/actions/scan@v4
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          path: Env_module/Pre_prod


  # ============================================================
  # TERRAFORM APPLY
  # Runs ONLY after successful CI on main
  # ============================================================

  terraform-apply:
    name: Terraform Apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - terraform-ci
      - infracost-scan

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Env_module/Pre_prod

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Terraform Setup
      # ----------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ----------------------------------------------------------
      # Azure OIDC Login
      # ----------------------------------------------------------

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ----------------------------------------------------------
      # Terraform Init
      # ----------------------------------------------------------

      - name: Terraform Init
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform init

      # ----------------------------------------------------------
      # Terraform Apply
      # ----------------------------------------------------------

      - name: Terraform Apply
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform apply -auto-approve